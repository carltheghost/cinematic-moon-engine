<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinematic Moon Engine — Phase 3 (environment)</title>
<style>
  html, body { margin: 0; height: 100%; background: #030507; }
  #app { position: fixed; inset: 0; z-index: 1; }
  /* Scroll-driven chapter clock: the page scrolls (13 chapters × 100vh)
   * BEHIND the fixed canvas; the canvas renders the chapter at scrollY. */
  #scroll-space { position: relative; z-index: 0; height: 1300vh; }
  canvas { display: block; }
  /* Loader overlay: shown during the seeded bake, hidden after first frame. */
  #loader {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: #030507; color: #cfd8e3;
    font: 13px/1.5 system-ui, sans-serif; letter-spacing: 0.18em;
  }
  #loader .ring {
    width: 54px; height: 54px; border-radius: 50%;
    border: 2px solid #2a3542; border-top-color: #e0552b;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader .sub { letter-spacing: 0.08em; color: #6b7684; font-size: 11px; }
</style>
</head>
<body>
<div id="scroll-space" aria-hidden="true"></div>
<div id="app"></div>
<div id="loader" role="status" aria-label="Baking moon">
  <div class="ring"></div>
  <div>BAKING MOON</div>
  <div class="sub" id="loader-sub">seeded crater field · 2048²</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "postprocessing": "./vendor/postprocessing/index.js"
  }
}
</script>
<script type="module">
/* Phase 2 boot: seeded moon bake behind a loader overlay, real moon scene.
 *
 * Bake budget (FINAL-PLAN §6): desktop < 1.5 s, mobile < 3 s for the 2048²
 * bake. Timing is measured HERE (host side — engine/ must not touch clocks,
 * per the grep gate). On breach: dispose the 2048² textures, re-bake at
 * 1024², log the fallback. Either way the moon is real before first frame.
 * Determinism note (Phase 7): the budget fallback is wall-clock-dependent,
 * so the same URL can bake at 2048² or 1024² depending on machine load —
 * different pixels. Harness boots that assert pixel identity pin
 * ?bakeRes=2048 (disables the fallback; unset = production behavior above).
 */
import * as THREE from 'three';
import { Rng, TIER_TABLE } from './engine/seed.js';
import * as skym from './engine/sky.js';
import * as starm from './engine/stars.js';
import * as postm from './engine/post.js';
import * as moonm from './engine/moon.js';
import * as envm from './engine/environment.js';
import * as chaptersm from './engine/chapters.js';
import { createCamera } from './engine/camera.js';
import { canonicalPresentation } from './engine/presentation.js';
/* Phase 7: scene registry — the explicit extension mechanism for second
 * scenes (engine/scene.js). ?scene=<id> selects the scene config
 * (default: the canonical Mimas scene); scenes/scene-index.js registers
 * the built-in loaders. This is a loader seam, not content management
 * (FINAL-PLAN §8 stays out of scope). */
import { loadScene } from './engine/scene.js';
import './scenes/scene-index.js';
import {
  resolveTier, selectTierFromWarmup, stepDown, createWatchdog,
  BLOOM_VISUAL_BAKEOFF,
} from './engine/tiermanager.js';

const params = new URLSearchParams(location.search);
const SEED = parseInt(params.get('seed') || '7', 10);
/* Raw ?tier= value; resolved to a real tier AFTER reducedMotion is known
 * (Phase 5: reduced motion forces 'still'; ?tier= bypasses auto-select). */
const TIER_PARAM = params.get('tier');
/* Phase 5 A/B: ?emberfloor=1 forces the mobile ember perceptual floor on
 * (default off = Grok variant). See docs/phase5-design.md §4. */
const EMBER_FLOOR = params.get('emberfloor') === '1';
/* Phase 16 experiment seam: ?emberlift=0..1 lifts the additive ember signal
 * without rewriting scene chapter data. Unset means the scene-config value
 * (or zero for legacy scenes), so canonical URLs stay byte-compatible. */
const emberLiftRaw = params.get('emberlift');
const EMBER_SIGNAL_LIFT = emberLiftRaw === null
  ? null
  : Math.max(0, Math.min(1, Number(emberLiftRaw) || 0));
/* Autoplay (opt-in, presentation only): advances a virtual scroll by a FIXED
 * 2px per rAF tick (frame-counted, NOT time-based). EXCLUDED from the
 * determinism contract — the contract covers explicit scroll positions only. */
const AUTOPLAY = params.get('autoplay') === '1';
let autoplayY = 0;
/* Benchmark (opt-in, host-side only): ?benchmark=1 counts 240 post-warmup
 * frames with performance.now() and logs FPS + p95 frame time to the console.
 * It changes NOTHING about what is rendered — the loop body is identical;
 * only dt is recorded. For clean numbers use an explicit tier
 * (?tier=cinematic) so the watchdog can't step down mid-run. Results land in
 * window.__cmeBenchmark. See docs/device-qa.md for the physical-device
 * protocol. Never quote VM SwiftShader numbers as device evidence. */
const BENCHMARK = params.get('benchmark') === '1';
const BENCH_FRAMES = 240;
let benchDts = BENCHMARK ? [] : null;
/* Bake-resolution pin (harness-only, Phase 7): ?bakeRes=2048 forces the
 * seeded moon bake to that resolution and DISABLES the wall-clock budget
 * fallback below. Unset (0) → production behavior byte-identical: 2048²
 * attempt with the 1500 ms desktop / 3000 ms mobile budget and 1024²
 * re-bake on breach. The budget fallback is wall-clock-dependent (VM load),
 * so harness boots that assert pixel identity MUST pin ?bakeRes=2048 —
 * otherwise the same URL can render different pixels run to run. */
const BAKE_RES_PIN = parseInt(params.get('bakeRes') || '0', 10) || 0;
/* TIER/tierCfg are resolved after reducedMotion is known (below) — Phase 5. */

/* Hero frame constants (also recorded in harness/hero-frame.json). */
const MOON_AZ = 0.35, MOON_EL = 0.16, MOON_DIST = 1000, MOON_R = 151;
const CAM_FOV = 55;
const CAM_LOOK_EL = 0.333; // look slightly above the moon: moon sits low in frame

function azElToDir(az, el) {
  const ce = Math.cos(el);
  return new THREE.Vector3(ce * Math.cos(az), Math.sin(el), ce * Math.sin(az));
}

const app = document.getElementById('app');
const loaderEl = document.getElementById('loader');
const loaderSub = document.getElementById('loader-sub');
const bootLog = [];
function pushLog(msg) { bootLog.push(msg); console.log('[cme]', msg); }

/* Phase 7: resolve the scene config BEFORE any engine module is built.
 * Unknown ids fail LOUDLY (loader shows the error, boot flag never sets) —
 * a typo'd ?scene= must never silently masquerade as the canonical scene. */
const SCENE_ID = params.get('scene') || 'mimas';
let sceneCfg;
try {
  sceneCfg = await loadScene(SCENE_ID);
} catch (err) {
  loaderSub.textContent = `scene error: ${err.message}`;
  window.__cmeBootError = `scene: ${err.message}`;
  console.error('[cme]', err.message);
  throw err;
}
pushLog(`scene: ${sceneCfg.id} — ${sceneCfg.title}`);
/* The scroll-space height is scene config (chapters × 100vh); the canonical
 * scene's 1300vh keeps the layout byte-identical to pre-Phase-7. */
document.getElementById('scroll-space').style.height = `${sceneCfg.scrollSpaceVh}vh`;

/* Loader must be painted BEFORE the (synchronous, heavy) bake starts. */
window.__cmeLoaderSeen = true;
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping; // the grade pass owns tone mapping
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Fog is owned by Sky: scene.fog IS sky.fog (same instance), so the fog
// color can never drift from sky.horizonColor (FINAL-PLAN §1.2). Assigned
// after buildSky below.
const camera = new THREE.PerspectiveCamera(CAM_FOV, innerWidth / innerHeight, 1, 8000);
/* The chapter camera is the single source of truth for camera pose — the
 * first applyScrollState(0) call (after scene build, before first frame)
 * sets the initial position/lookAt/fov. */

/* --- The seeded bake (host-timed; engine/ never touches clocks). --- */
const isMobile = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || innerWidth < 768;
/* Reduced motion: grain uFrame pinned to 0 (deterministic still). */
const reducedMotion = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || false;

/* --- Phase 5: tier resolution (FINAL-PLAN D5, engine/tiermanager.js). ---
 * Precedence: reducedMotion → forced 'still' (the only honest tier for
 * stepped stills); else ?tier= → manual (bypasses warmup + watchdog);
 * else auto (boot at cinematic, 60-frame warmup benchmark selects). */
const tierResolution = resolveTier({ tierParam: TIER_PARAM, reducedMotion });
let TIER = tierResolution.tier;
let tierCfg = TIER_TABLE[TIER];
const TIER_MODE = tierResolution.mode; // 'forced-still' | 'manual' | 'auto'
pushLog(`tier: ${TIER} (mode=${TIER_MODE}) — ${tierResolution.reason}`);
const budgetMs = isMobile ? 3000 : 1500; // desktop 1.5 s, mobile 3 s
const rng = new Rng(SEED);
/* Phase 7: colorScript comes from the scene config (null → the Phase-4-frozen
 * COLOR_SCRIPT default — the canonical scene is pixel-identical). */
let moon, bakeMs, resolution = 2048, fallback = null;
{
  /* Phase 7: ?bakeRes= pins the bake resolution (harness determinism) and
   * disables the wall-clock budget fallback. Unset → production behavior:
   * 2048² attempt with budget fallback to 1024², byte-identical to before. */
  const targetRes = BAKE_RES_PIN > 0 ? BAKE_RES_PIN : 2048;
  const t0 = performance.now();
  moon = moonm.buildMoon(rng, { resolution: targetRes, seed: SEED, chapter: 3, radius: MOON_R, colorScript: sceneCfg.colorScript });
  bakeMs = performance.now() - t0;
  resolution = targetRes;
  if (!BAKE_RES_PIN && bakeMs > budgetMs) {
    pushLog(`bake: 2048² took ${bakeMs.toFixed(0)} ms > budget ${budgetMs} ms — disposing, re-baking at 1024²`);
    moon.dispose();
    fallback = { from: 2048, to: 1024, bakeMs2048: bakeMs, budgetMs };
    loaderSub.textContent = 'budget exceeded — re-baking at 1024²';
    const t1 = performance.now();
    moon = moonm.buildMoon(new Rng(SEED), { resolution: 1024, seed: SEED, chapter: 3, radius: MOON_R, colorScript: sceneCfg.colorScript });
    bakeMs = performance.now() - t1;
    resolution = 1024;
    pushLog(`bake: 1024² fallback took ${bakeMs.toFixed(0)} ms`);
  }
  pushLog(`bake: ${resolution}² in ${bakeMs.toFixed(0)} ms` +
    (BAKE_RES_PIN ? ` (pinned via ?bakeRes=${BAKE_RES_PIN}, budget fallback disabled)` : ` (budget ${budgetMs} ms)`) +
    ` hashAlbedo=${moon.hashAlbedo} hashNormal=${moon.hashNormal} craters=${moon.bake.craterCount}`);
}

/* Moon placement + sun.
 * Full-moon geometry: the sun sits behind the camera (L ≈ -moonDir), tilted
 * ~15° for a hint of relief modeling. (A sun 25° off the view axis in SKY
 * terms would put the visible face on the night side — crescent, not hero.) */
const moonDir = azElToDir(MOON_AZ, MOON_EL);
moon.group.position.copy(moonDir).multiplyScalar(MOON_DIST);
moon.sphere.lookAt(camera.position); // align sphere UV front with the disc fallback
{
  const sunDir = moonDir.clone().negate();
  const up = new THREE.Vector3(0, 1, 0);
  const side = new THREE.Vector3().crossVectors(sunDir, up).normalize();
  const up2 = new THREE.Vector3().crossVectors(side, sunDir).normalize();
  sunDir.applyAxisAngle(side, -0.20).applyAxisAngle(up2, 0.16).normalize();
  moon.setSunDirection(sunDir);
}
moon.setMeshMode(tierCfg.moonMesh === 'sphere' ? 'sphere' : 'disc');
scene.add(moon.group);

/* Sky + stars (Phase 1, unchanged) keyed to the real moon direction. */
const sky = skym.buildSky(rng);
sky.setMoonDirection(MOON_AZ, MOON_EL);
scene.add(sky.mesh);
scene.fog = sky.fog; // single source of truth: fog.color === sky.horizonColor
const stars = starm.buildStars(new Rng(SEED ^ 0x51ed), TIER); // Phase 5: real tier string (was an options object → always cinematic)
stars.setMoonPosition(moonDir.clone());
scene.add(stars.points);

/* Environment (Phase 3): terrain, scatter, embers, water glint, light rig.
 * Dependency order: Seed → Sky → {Moon, Stars} → Environment → Post. */
let env = envm.buildEnvironment(new Rng((SEED ^ 0xe117) >>> 0), {
  sky,
  seed: SEED,
  moonAzimuth: MOON_AZ,
  moonElevation: MOON_EL,
  tier: TIER,
  emberFloor: EMBER_FLOOR,
});
scene.add(env.group);
pushLog(`env: terrain+water+scatter built (seed=${SEED} tier=${TIER} ` +
  `trees=${env.counts.trees} rocks=${env.counts.rocks} lanterns=${env.counts.lanterns} ` +
  `embers=${env.counts.embers} layout=${env.layoutHash()} ` +
  `lightRatio=${env.lightRatio().ratio.toFixed(2)})`);

/* Post pipeline (Phase 1): RenderPass → bloom → grade. */
const post = postm.buildPost(renderer, scene, camera, { tier: TIER, seed: SEED, reducedMotion });

/* Phase 7: scene CONTENT hook — runs once at boot after the engine modules
 * are built. Scene-specific wiring (blood-moon hooks, grade LUTs) lives in
 * the scene config's decorate(), not in this host page. Null for the
 * canonical scene (no-op). */
if (sceneCfg.decorate) {
  sceneCfg.decorate({
    moon, env, post, postm, camera, scene, renderer, THREE,
    seed: SEED, config: sceneCfg,
  });
  pushLog(`scene: decorate() applied for "${sceneCfg.id}"`);
}

/* --- Deterministic scroll-driven chapter clock (Phase 4b, Phase 5 coords). ---
 * Render state is a PURE function of scroll position: the ONLY clock is the
 * canonical presentation coordinate set from engine/presentation.js —
 * (p, canonicalChapterT, motionChapterT, canonicalSimTime, motionSimTime,
 * frame). No frame counter, no wall clocks anywhere in the canonical path.
 * Under reduced motion, motion* coordinates are the quantized stepped stills;
 * EVERY motion-producing subsystem (camera, moon, environment, post) consumes
 * them — no continuous post animation while the camera is stepped (GPT Q7). */
/* Phase 7: chapters + chapterLocator come from the scene config (nulls →
 * the frozen canonical defaults — pixel-identical for the Mimas scene). */
const cameraCtl = createCamera({
  chapters: sceneCfg.chapters,
  chapterLocator: sceneCfg.chapterLocator ?? undefined,
});
let scrollOverride = null; // harness-only: renderFrame/setScrollP write here

function maxScrollY() {
  return document.documentElement.scrollHeight - window.innerHeight;
}

/**
 * Canonical apply path — used by BOTH the live loop and the harness.
 * No smoothing, no damping, no lerp of scrollY: read it raw every frame.
 * Returns the camera state merged with its presentation coordinates
 * ({...cam, presentation}).
 */
function applyScrollState(scrollY) {
  /* Phase 7: the clock is scene config (defaults 13/312 = frozen canonical). */
  const pres = canonicalPresentation({
    scrollY, maxScroll: maxScrollY(), reducedMotion,
    chapterCount: sceneCfg.chapterCount, simDuration: sceneCfg.simDuration,
  });
  const cam = cameraCtl.evaluateAt(pres.motionChapterT);
  camera.position.set(cam.position.x, cam.position.y, cam.position.z);
  camera.lookAt(cam.lookTarget.x, cam.lookTarget.y, cam.lookTarget.z);
  camera.fov = cam.fov;
  camera.updateProjectionMatrix();
  // Keep matrixWorldInverse current: projectedDisc() (the grain moon-mask)
  // reads it via Vector3.project(), and the renderer only refreshes it
  // during render — without this the mask lags one frame behind the pose.
  camera.updateMatrixWorld();
  /* Phase 7: chapter sampling is scene config (same interpolation model). */
  const ch = chaptersm.sampleChapterFrom(sceneCfg.chapters, pres.motionChapterT);
  moon.setChapter(pres.motionChapterT);
  const V = Math.exp(-Math.pow(400 * ch.fogDensity, 2)); // atmospheric transmission, dRef=400 — same formula as env docs
  const emberParams = EMBER_SIGNAL_LIFT === null
    ? ch.ember
    : { ...ch.ember, signalLift: EMBER_SIGNAL_LIFT };
  env.setChapterEnv({
    fogDensity: ch.fogDensity,
    ember: emberParams,
    lantern: ch.lantern,
    glint: { peak: V * ch.glint, width: 1 + 2.5 * (1 - V), contrast: 0.4 + 0.6 * V },
  });
  env.setTime(pres.motionSimTime);
  stars.setTime(pres.motionSimTime);
  post.setExposure(ch.exposure);
  return { ...cam, presentation: pres }; // simTime here === pres.motionSimTime, always
}

function currentScrollY() {
  return scrollOverride !== null ? scrollOverride : window.scrollY;
}

/* Projected moon mask, wired every frame (grain moon-mask + bake-off). */
function moonScreen() {
  return moon.projectedDisc(camera, innerWidth, innerHeight);
}
function wireMoonMask() {
  const pr = moonScreen();
  post.setMoonMask(
    { x: pr.x / innerWidth, y: 1 - pr.y / innerHeight },
    pr.rPx * renderer.getPixelRatio()
  );
  return pr;
}

/**
 * Deterministic harness entry — PURE in t (sim-seconds ∈ [0, simDuration],
 * 312 for the canonical scene): same t → same scrollY → same pixels. scrollOverride stays set; the live
 * loop then renders that state (acceptable and deterministic). Under reduced
 * motion the presentation layer quantizes to stepped stills (see
 * engine/presentation.js); the canonical coordinates remain inspectable on
 * the returned state.
 */
function renderFrame(t = 0) {
  /* Phase 7: the sim-duration bound is scene config (312 canonical). */
  const simDur = sceneCfg.simDuration;
  scrollOverride = (Math.max(0, Math.min(simDur, t)) / simDur) * maxScrollY();
  const cam = applyScrollState(scrollOverride);
  wireMoonMask();
  post.render(cam.presentation.frame);
  return readPixels();
}

/**
 * Raw-scroll presentation entry (Phase 5 harness): renders the presentation
 * state for an explicit scrollY — the path the reduced-motion stepped-stills
 * check uses (two raw scrollYs in one quantization basin must be
 * pixel-identical).
 */
function renderAtScrollY(scrollY) {
  scrollOverride = Math.min(maxScrollY(), Math.max(0, scrollY));
  const cam = applyScrollState(scrollOverride);
  wireMoonMask();
  post.render(cam.presentation.frame);
  return { pixels: readPixels(), state: cam };
}

/** Scripted moon move for the glint-alignment test (restores via same fn). */
function setMoonAzEl(az, el) {
  const dir = azElToDir(az, el);
  moon.group.position.copy(dir).multiplyScalar(MOON_DIST);
  moon.sphere.lookAt(camera.position);
  const sunDir = dir.clone().negate();
  const up = new THREE.Vector3(0, 1, 0);
  const side = new THREE.Vector3().crossVectors(sunDir, up).normalize();
  const up2 = new THREE.Vector3().crossVectors(side, sunDir).normalize();
  sunDir.applyAxisAngle(side, -0.20).applyAxisAngle(up2, 0.16).normalize();
  moon.setSunDirection(sunDir);
  sky.setMoonDirection(az, el);
  env.setMoonDirection(az, el);
}

/** Rebuild the environment in place; returns {h1, h2, match} for the
 * determinism check (same seed ⇒ same layout hash). */
function rebuildEnv() {
  const h1 = env.layoutHash();
  scene.remove(env.group);
  env.dispose();
  env = envm.buildEnvironment(new Rng((SEED ^ 0xe117) >>> 0), {
    sky, seed: SEED, moonAzimuth: MOON_AZ, moonElevation: MOON_EL, tier: TIER,
    emberFloor: EMBER_FLOOR,
  });
  scene.add(env.group);
  window.__cme.env = env;
  const h2 = env.layoutHash();
  return { h1, h2, match: h1 === h2 };
}

/** Total draw calls across the full post chain (renderer.info, no auto-reset). */
function drawCalls() {
  renderer.info.autoReset = false;
  renderer.info.reset();
  // Canonical state first: chapter 10 (p = 9/12) — deterministic.
  setScrollP(9 / 12);
  const cam = applyScrollState(currentScrollY());
  wireMoonMask();
  post.render(cam.presentation.frame);
  const out = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  renderer.info.autoReset = true;
  renderer.info.reset();
  return out;
}

/* Phase-1 harness compat: canvas readback + fixture projection. */
function readPixels() {
  const gl = renderer.getContext();
  // The composer may leave an internal render target bound; bind the canvas
  // explicitly so gl.readPixels reads the final graded frame, not a stale buffer.
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const w = renderer.domElement.width, h = renderer.domElement.height;
  const raw = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, raw);
  const out = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) out.set(raw.subarray(y * w * 4, (y + 1) * w * 4), (h - 1 - y) * w * 4);
  return { width: w, height: h, data: Array.from(out) };
}

/* Bake/boot log for harness check (a). */
window.__cmeBakeLog = {
  loaderSeen: !!window.__cmeLoaderSeen,
  bakeMs, budgetMs, resolution, fallback,
  seed: SEED,
  hashAlbedo: moon.hashAlbedo,
  hashNormal: moon.hashNormal,
  craterCount: moon.bake.craterCount,
  normalVariance: moon.bake.normalVariance,
  tier: TIER,
  meshMode: moon.meshMode,
  bootLog: bootLog.slice(),
};

/**
 * Harness hook: pin the live loop to a normalized scroll position p∈[0,1]
 * (clamped). clearScrollOverride() hands control back to window.scrollY.
 */
function setScrollP(p) {
  const pc = Math.min(1, Math.max(0, p));
  scrollOverride = pc * maxScrollY();
  return pc;
}
function clearScrollOverride() {
  scrollOverride = null;
}

window.__cme = {
  THREE, renderer, scene, camera, sky, stars, post, postm, moon,
  moonm, envm, tierCfg,
  get tier() { return TIER; }, // Phase 5: mutable via applyTier (warmup/watchdog)
  get tierMode() { return TIER_MODE; }, // 'forced-still' | 'manual' | 'auto'
  applyTier, // Phase 5: harness + watchdog tier application
  get env() { return env; },
  set env(v) { env = v; },
  setMoonAzEl, rebuildEnv, drawCalls,
  moonScreen, renderFrame, renderAtScrollY, readPixels,
  presentation: canonicalPresentation, // Phase 5: the canonical coordinate set
  fixtureScreen: moonScreen, // Phase-1 harness name → real moon projection
  fixture: moon.group, // Phase-1 harness name → the real moon now
  dpr: renderer.getPixelRatio(),
  bootLog,
  // Phase 4b: deterministic chapter clock hooks
  setScrollP, clearScrollOverride, applyScrollState,
  chapters: chaptersm, cameraCtl, sampleChapter: chaptersm.sampleChapter,
  sampleChapterFrom: chaptersm.sampleChapterFrom, // Phase 7: scene-parameterized sampler
  createCamera, // Phase 7: exposed for harness locator-injection checks
  SIM_DURATION: sceneCfg.simDuration, // Phase 7: scene clock (312 canonical)
  scene: sceneCfg.id, // Phase 7: the active scene id (?scene=)
  sceneConfig: sceneCfg, // Phase 7: the resolved scene config
  bakeResPin: BAKE_RES_PIN, // Phase 7: ?bakeRes= pin (0 = production budget behavior)
  emberSignalLiftOverride: EMBER_SIGNAL_LIFT, // Phase 16: null unless ?emberlift= is explicit
  get bakeResolution() { return resolution; }, // Phase 7: actual bake res (2048 or 1024 fallback)
};

/* Boot flags for the harness. */
window.__cmeBootError = null;
window.__cmeTierDecision = `phase2: tier=${TIER} (direct, ?tier=) mesh=${moon.meshMode} bake=${resolution}²`;
window.__cmeHudLog = bootLog;

/* Keep renderer/camera/composer in sync with the viewport. */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  post.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize(); // ensure canvas matches the final viewport (boot may race it)

/* --- Phase 5: tier application + watchdog + warmup (host side, FINAL-PLAN D5).
 * Wall-clock measurement lives ONLY here (host); engine/tiermanager.js
 * decides. dt never feeds pixels — tier is part of the rendering config,
 * and the determinism contract covers explicit-tier configurations
 * (?tier= ⇒ manual mode: no benchmark, no watchdog, fully deterministic). */
function applyTier(nextTier, why) {
  if (nextTier === TIER) return;
  const from = TIER;
  TIER = nextTier;
  tierCfg = TIER_TABLE[TIER];
  post.setQuality(TIER); // 30-frame deterministic bloom crossfade
  // Star counts: prefix draw-range of the seeded build (deterministic).
  stars.points.geometry.setDrawRange(0, starm.STAR_CONTRACT.counts[TIER]);
  moon.setMeshMode(tierCfg.moonMesh === 'sphere' ? 'sphere' : 'disc');
  // NOTE: env scatter stays at boot-tier scale (built once); the watchdog
  // sheds the big-ticket items (bloom, stars, moon mesh). Documented.
  pushLog(`tier: ${from} → ${TIER} (${why})`);
}

/* Balanced-tier bloom: two gates, BOTH required (addendum). The Phase 2
 * visual bake-off is CLOSED (3.8% < 20%) so the runtime probe is not run —
 * the machinery (bloomProbeDecision) is implemented and unit-tested for a
 * bake-off re-run. This log line is the enforcement record. */
function maybeBloomProbe() {
  if (TIER !== 'balanced') return;
  pushLog(`bloom: balanced stays halo-only — Phase 2 visual bake-off closed ` +
    `(${BLOOM_VISUAL_BAKEOFF.rationale.slice(0, 80)}…); runtime probe gated on re-run`);
}

const WARMUP_FRAMES = 60; // seed.js WARMUP.frames
const autoTier = TIER_MODE === 'auto';
let warmupDts = autoTier ? [] : null;
let warmupDone = !autoTier;
const watchdog = autoTier ? createWatchdog() : null;
let lastFrameT = 0;
let paused = false;
let contextLost = false;
let rafId = 0;

/* First frame. Auto mode keeps the loader until the 60-frame warmup
 * benchmark selects the honest tier; manual/forced-still reveal at once. */
{
  const cam = applyScrollState(0);
  wireMoonMask();
  post.render(cam.presentation.frame);
}
if (!autoTier) {
  loaderEl.style.display = 'none';
  window.__cmeBoot = true;
}
maybeBloomProbe();
pushLog(`boot: first frame rendered (tier=${TIER} mode=${TIER_MODE}, mesh=${moon.meshMode})`);

function loop() {
  rafId = requestAnimationFrame(loop);
  if (paused) return;
  // Host-side frame timing ONLY (never feeds pixels — tier decisions only).
  const now = performance.now();
  const dtSynthetic = lastFrameT === 0; // first frame: no measured dt yet
  const dt = dtSynthetic ? 16.7 : now - lastFrameT;
  lastFrameT = now;
  // AUTOPLAY is opt-in presentation only — excluded from the determinism
  // contract (the contract covers explicit scroll positions, not this).
  let y = currentScrollY();
  if (AUTOPLAY) {
    autoplayY += 2; // FIXED 2px per rAF tick (frame-counted, not time-based)
    if (autoplayY > maxScrollY()) autoplayY = 0; // wrap for continuous playback
    y = autoplayY;
  }
  const cam = applyScrollState(y);
  wireMoonMask();
  post.render(cam.presentation.frame);
  // Benchmark (host-side only): count frames, change nothing rendered.
  // Skips the synthetic first-frame dt — all 240 frames are measured.
  if (benchDts && warmupDone && !dtSynthetic && benchDts.length < BENCH_FRAMES) {
    benchDts.push(dt);
    if (benchDts.length >= BENCH_FRAMES) {
      const sorted = [...benchDts].sort((a, b) => a - b);
      const p95 = sorted[Math.floor(sorted.length * 0.95)];
      const mean = benchDts.reduce((a, b) => a + b, 0) / benchDts.length;
      const fps = 1000 / mean;
      window.__cmeBenchmark = {
        frames: BENCH_FRAMES, fps: +fps.toFixed(1),
        meanMs: +mean.toFixed(2), p95Ms: +p95.toFixed(2), tier: TIER,
      };
      pushLog(`benchmark: ${fps.toFixed(1)} fps mean=${mean.toFixed(2)}ms ` +
        `p95=${p95.toFixed(2)}ms over ${BENCH_FRAMES} frames (tier=${TIER})`);
    }
  }
  // Warmup benchmark (auto mode): first 60 real frames select the tier.
  if (!warmupDone) {
    warmupDts.push(dt);
    if (warmupDts.length >= WARMUP_FRAMES) {
      warmupDone = true;
      const fps = 1000 / (warmupDts.reduce((a, b) => a + b, 0) / warmupDts.length);
      const selected = selectTierFromWarmup(fps);
      pushLog(`warmup: ${fps.toFixed(1)} fps over ${WARMUP_FRAMES} frames → ${selected} ` +
        `(thresholds ≥55 cinematic / ≥35 balanced)`);
      if (selected !== TIER) applyTier(selected, `warmup ${fps.toFixed(1)} fps`);
      maybeBloomProbe();
      loaderEl.style.display = 'none';
      window.__cmeBoot = true;
    }
    return;
  }
  // Watchdog (auto mode only): one-way step-down, never oscillates.
  if (watchdog && watchdog.observe(dt)) {
    applyTier(stepDown(TIER), 'watchdog: rolling p95 frame > 20ms for 120 consecutive frames');
    maybeBloomProbe();
  }
}
rafId = requestAnimationFrame(loop);

/* Tab-hidden render pause (Phase 5 produces). */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    paused = true;
    cancelAnimationFrame(rafId);
    pushLog('pause: tab hidden — render loop suspended');
  } else if (!contextLost) {
    paused = false;
    lastFrameT = 0; // no huge resume dt tripping the watchdog
    rafId = requestAnimationFrame(loop);
    pushLog('resume: tab visible — render loop resumed');
  }
});

/* Context loss: frozen still = no animation, no crossfade (addendum). */
renderer.domElement.addEventListener('webglcontextlost', (e) => {
  e.preventDefault();
  contextLost = true;
  paused = true;
  cancelAnimationFrame(rafId);
  if (TIER !== 'still') applyTier('still', 'webglcontextlost — frozen still');
  pushLog('context lost — forced still tier, loop suspended');
});
renderer.domElement.addEventListener('webglcontextrestored', () => {
  contextLost = false;
  paused = false;
  lastFrameT = 0;
  rafId = requestAnimationFrame(loop);
  pushLog('context restored — loop resumed at still tier');
});
</script>
</body>
</html>
